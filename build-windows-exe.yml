name: Build LUAHUB AFK Control EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "luahub_afk_control.py"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyautogui pynput pyinstaller

      - name: Build standalone EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name LUAHUB-AFK-Control luahub_afk_control.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: LUAHUB-AFK-Control-EXE
          path: dist/LUAHUB-AFK-Control.exe
          if-no-files-found: error
          retention-days: 14
